[project]
name = "quanta"
version = "0.1.0"
description = "Digital Twin AI Application"
requires-python = ">=3.10"
dependencies = [
    "flask~=3.1.0",
    "flask-cors~=5.0.0",
    "firebase-admin~=6.6.0",
    "python-dotenv~=1.0.0",
    "gunicorn~=23.0.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "google-generativeai>=0.8.0",
    "openai>=1.50.0"
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "run:app"
